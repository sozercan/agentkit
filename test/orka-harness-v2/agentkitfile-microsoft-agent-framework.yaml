#syntax=agentkit:test
apiVersion: v1alpha1
kind: Agent
metadata:
  name: orka-v2-e2e
runtime: microsoft-agent-framework
model:
  provider: openai-compatible
  # ACP must replace this with the supervisor's authenticated loopback proxy.
  baseURL: http://provider.invalid/v1
  name: gpt-4o-mini
  apiKeyEnv: OPENAI_API_KEY
instructions: |
  Follow the user's requested marker and tool instructions exactly.
  When asked to use a tool, call it and include its returned marker in your answer.
  Keep answers brief.
expose:
  openai: true
